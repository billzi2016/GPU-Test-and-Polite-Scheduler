poll_interval_seconds: 60
gpu_busy_threshold_percent: 5
watchdog_session_name: gpu-watchdog
log_dir: logs
auto_restart: true
tasks:
  - name: sample-gpu-0
    gpu_id: 0
    command: "python examples/example_atomic_task.py --checkpoint-dir outputs/sample-gpu-0"
    workdir: "."
    log_file: "logs/sample-gpu-0.log"
  - name: sample-gpu-1
    gpu_id: 1
    command: "python examples/example_atomic_task.py --checkpoint-dir outputs/sample-gpu-1"
    workdir: "."
    log_file: "logs/sample-gpu-1.log"
